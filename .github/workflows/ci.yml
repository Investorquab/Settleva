name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: settleva
          POSTGRES_PASSWORD: settleva
          POSTGRES_DB: settleva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settleva -d settleva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://settleva:settleva@localhost:5432/settleva
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r check
      - run: pnpm -r test
      - run: pnpm -r build

  contracts:
    name: Arc Foundry contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Arc Foundry release
        shell: bash
        run: |
          set -euo pipefail
          version="v0.8.0-2"
          archive="arc-foundry-${version}-x86_64-unknown-linux-gnu.tar.gz"
          base_url="https://github.com/circlefin/arc-foundry/releases/download/${version}"

          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "${base_url}/${archive}" --output "${archive}"

          # Pin the SHA-256 published for this exact Circle Arc Foundry release.
          echo "088bdb96a84418b757f9825d491e702792f1d1d1e29a9145af305a6600a79556  ${archive}" \
            | sha256sum --check -

          mkdir -p "${HOME}/.local/bin" /tmp/arc-foundry
          tar -xzf "${archive}" -C /tmp/arc-foundry
          install -m 0755 /tmp/arc-foundry/forge "${HOME}/.local/bin/arc-forge"
          install -m 0755 /tmp/arc-foundry/cast "${HOME}/.local/bin/arc-cast"
          install -m 0755 /tmp/arc-foundry/anvil "${HOME}/.local/bin/arc-anvil"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

          "${HOME}/.local/bin/arc-forge" --version
          "${HOME}/.local/bin/arc-cast" --version
          "${HOME}/.local/bin/arc-anvil" --version
      - name: Install forge-std
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: arc
        run: arc-forge install foundry-rs/forge-std
      - name: Build with Arc execution semantics
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: arc
        run: arc-forge build --sizes
      - name: Run contract tests with Arc execution semantics
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: arc
        run: arc-forge test -vvv

  ci-evidence:
    name: Record CI validation evidence (not a live deployment)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck, contracts]
    runs-on: ubuntu-latest
    environment:
      name: ci-validation
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Record successful CI validation
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "ci-validation",
              description: "Settleva CI validation record; no production services or contract deployed",
              auto_merge: false,
              required_contexts: []
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment: "ci-validation",
              description: "Code checks, tests, and builds passed; this is not a live deployment"
            });

            core.info(`ci_validation_id=${deployment.data.id}`);
            core.info(`repository=${context.repo.owner}/${context.repo.repo}`);
            core.info(`ref=${context.ref}`);
            core.info(`sha=${context.sha}`);
