name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: settleva
          POSTGRES_PASSWORD: settleva
          POSTGRES_DB: settleva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settleva -d settleva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://settleva:settleva@localhost:5432/settleva
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r check
      - run: pnpm -r test
      - run: pnpm -r build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install forge-std
        working-directory: contracts
        run: forge install foundry-rs/forge-std
      - name: Run Foundry tests
        working-directory: contracts
        run: forge test -vvv

  deployment-evidence:
    name: Record production deployment evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck, contracts]
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Create production deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "production",
              description: "Settleva production deployment evidence",
              auto_merge: false,
              required_contexts: []
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment: "production",
              description: "Settleva CI validation passed"
            });

            core.info(`deployment_id=${deployment.data.id}`);
            core.info(`repository=${context.repo.owner}/${context.repo.repo}`);
            core.info(`ref=${context.ref}`);
            core.info(`sha=${context.sha}`);
